[package]
name = "tor-link-finder"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["cargo"] }
futures = "0.3.34"
hypertor = "0.3.0"
indicatif = "0.18.6"
reqwest = { version = "0.12", features = ["cookies"] }
scraper = "0.29.0"
tabled = { version = "0.20", features = ["ansi"] }
terminal_size = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.10.3"
